spring:
  application:
    name: gymflow

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

logging:
  level:
    root: INFO

jwt:
  secret: ${ENV_JWT_SECRET:"gymflow-secret-key"}

springdoc:
  swagger-ui:
    tags-sorter: alpha
